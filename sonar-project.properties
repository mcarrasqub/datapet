# Identificadores únicos del proyecto
sonar.projectKey=mcarrasqub_datapet
sonar.projectName=DataPet - Sistema de Gestión Veterinaria
sonar.projectVersion=1.0.0
sonar.organization=mcarrasqub

# Rutas de código y tests
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusiones
sonar.exclusions=vendor/**, public/**, resources/**, database/**, bootstrap/**

# Configuración de cobertura de código
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-report.xml

# Umbrales de calidad (Quality Gate)
sonar.qualitygate.wait=true

# Configuración de PHPUnit
sonar.php.file.suffixes=.php
sonar.php.parse.custom_functions=dd,dump,ddd

# Máximo de issues que se permiten
sonar.projectBaseDir=.

# Configuración de análisis de complejidad
sonar.php.exclusions=vendor/**,tests/**

# Configuración de duplicación
sonar.cpd.php.minimumTokens=100
sonar.cpd.php.minimumLines=5